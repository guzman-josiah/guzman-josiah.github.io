<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #161922;
    --surface2: #1e2230;
    --border: rgba(255,255,255,0.08);
    --text: #f0f2f7;
    --muted: #7a8299;
    --accent: #4f7cff;
    --gold: #f5c842;
    --silver: #b0bec5;
    --bronze: #cd7f45;
    --danger: #ff5f5f;
    --radius: 12px;
    --font: 'Sora', sans-serif;
    --mono: 'DM Mono', monospace;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1.5rem 4rem;
  }

  .page-wrapper { max-width: 860px; margin: 0 auto; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2.5rem;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .title-block h1 {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .title-block p {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: var(--mono);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .header-actions { display: flex; gap: 10px; }

  button {
    font-family: var(--font);
    font-size: 0.8rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    padding: 9px 18px;
    transition: all 0.15s ease;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: #3b68f0; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: #262c3d; }

  .btn-danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid rgba(255,95,95,0.3);
    padding: 6px 10px;
    font-size: 0.72rem;
  }
  .btn-danger:hover { background: rgba(255,95,95,0.1); }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    margin-bottom: 2rem;
  }

  #chart-area { display: flex; flex-direction: column; gap: 14px; }

  .bar-row {
    display: grid;
    grid-template-columns: 130px 1fr 80px;
    align-items: center;
    gap: 14px;
    animation: fadeIn 0.35s ease forwards;
    opacity: 0;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .rank-name {
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
  }

  .rank-badge {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    font-family: var(--mono);
    flex-shrink: 0;
  }

  .rank-1 { background: rgba(245,200,66,0.15); color: var(--gold); }
  .rank-2 { background: rgba(176,190,197,0.15); color: var(--silver); }
  .rank-3 { background: rgba(205,127,69,0.15); color: var(--bronze); }
  .rank-other { background: var(--surface2); color: var(--muted); }

  .team-label {
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }

  .bar-track {
    position: relative;
    height: 36px;
    background: var(--surface2);
    border-radius: 8px;
    overflow: hidden;
  }

  .bar-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    border-radius: 8px;
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    align-items: center;
    padding-left: 10px;
    min-width: 10px;
  }

  .score-col {
    font-family: var(--mono);
    font-size: 1rem;
    font-weight: 500;
    text-align: right;
    color: var(--text);
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 1.5rem 0;
  }

  .editor-section h2 {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 1.25rem;
    color: var(--text);
  }

  .editor-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .editor-row {
    display: grid;
    grid-template-columns: 1fr 140px auto;
    gap: 10px;
    align-items: center;
  }

  input[type="text"], input[type="number"] {
    font-family: var(--font);
    font-size: 0.85rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 9px 12px;
    width: 100%;
    transition: border-color 0.15s;
    outline: none;
  }

  input[type="text"]:focus, input[type="number"]:focus {
    border-color: var(--accent);
  }

  input[type="number"] { font-family: var(--mono); }

  .add-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }

  .add-row input { max-width: 220px; }
  .add-row input[type="number"] { max-width: 120px; }

  .save-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    margin-top: 1.5rem;
  }

  .hint { font-size: 0.75rem; color: var(--muted); }

  .toast {
    position: fixed;
    bottom: 2rem; right: 2rem;
    background: #1a2e1a;
    color: #6ee37a;
    border: 1px solid rgba(110,227,122,0.25);
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 0.82rem;
    font-weight: 600;
    opacity: 0;
    transform: translateY(12px);
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  #capture-zone {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    margin-bottom: 2rem;
  }

  .chart-header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }

  .chart-title {
    font-size: 1.2rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .chart-subtitle {
    font-size: 0.75rem;
    color: var(--muted);
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  @media (max-width: 600px) {
    .bar-row { grid-template-columns: 100px 1fr 60px; }
    .editor-row { grid-template-columns: 1fr 100px auto; }
    .team-label { font-size: 0.72rem; }
  }
</style>
</head>
<body>
<div class="page-wrapper">

  <header>
    <div class="title-block">
      <h1>🏆 Team Leaderboard</h1>
      <p>Rankings by points — Live & editable</p>
    </div>
    <div class="header-actions">
      <button class="btn-primary" onclick="saveImage()">⬇ Save as Image</button>
    </div>
  </header>

  <div id="capture-zone">
    <div class="chart-header">
      <span class="chart-title">Team Rankings</span>
      <span class="chart-subtitle" id="timestamp"></span>
    </div>
    <div id="chart-area" aria-label="Horizontal bar chart ranking teams by points"></div>
  </div>

  <div class="chart-card editor-section">
    <h2>✏️ Edit Teams &amp; Points</h2>
    <div class="editor-grid" id="editor-grid"></div>

    <div class="add-row">
      <input type="text" id="new-name" placeholder="New team name" maxlength="20" />
      <input type="number" id="new-pts" placeholder="Points" min="0" max="99999" />
      <button class="btn-secondary" onclick="addTeam()">+ Add</button>
    </div>

    <div class="save-bar">
      <span class="hint">Changes update the chart instantly.</span>
      <button class="btn-primary" onclick="saveImage()">⬇ Save Chart as Image</button>
    </div>
  </div>

</div>

<div class="toast" id="toast">✓ Image saved!</div>

<script>
const COLORS = [
  { fill: '#4f7cff', light: 'rgba(79,124,255,0.18)' },
  { fill: '#a259ff', light: 'rgba(162,89,255,0.18)' },
  { fill: '#00c9a7', light: 'rgba(0,201,167,0.18)' },
  { fill: '#ff7b54', light: 'rgba(255,123,84,0.18)' },
  { fill: '#f5c842', light: 'rgba(245,200,66,0.18)' },
  { fill: '#ff5fa0', light: 'rgba(255,95,160,0.18)' },
  { fill: '#43d9ad', light: 'rgba(67,217,173,0.18)' },
  { fill: '#ff9f1c', light: 'rgba(255,159,28,0.18)' },
];

let teams = [
  { name: 'ICU',       pts: 0 },
  { name: 'PCCU',      pts: 0 },
  { name: 'ORTHO',     pts: 0 },
  { name: 'ONCOLOGY',  pts: 0 },
  { name: 'CARITAS',   pts: 0 },
  { name: 'MED-SURG',  pts: 0 },
];

function sortedTeams() {
  return [...teams].map((t, i) => ({ ...t, origIdx: i }))
    .sort((a, b) => b.pts - a.pts);
}

function rankClass(i) {
  if (i === 0) return 'rank-1';
  if (i === 1) return 'rank-2';
  if (i === 2) return 'rank-3';
  return 'rank-other';
}

function renderChart() {
  const sorted = sortedTeams();
  const max = Math.max(...sorted.map(t => t.pts), 1);
  const area = document.getElementById('chart-area');
  area.innerHTML = '';

  sorted.forEach((team, rank) => {
    const pct = Math.round((team.pts / max) * 100);
    const color = COLORS[team.origIdx % COLORS.length];
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.style.animationDelay = (rank * 55) + 'ms';

    row.innerHTML = `
      <div class="rank-name">
        <span class="rank-badge ${rankClass(rank)}">#${rank + 1}</span>
        <span class="team-label" title="${esc(team.name)}">${esc(team.name)}</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${pct}%; background:${color.fill};" aria-valuenow="${team.pts}" aria-valuemax="${max}"></div>
      </div>
      <span class="score-col">${team.pts.toLocaleString()}</span>
    `;
    area.appendChild(row);
  });

  const ts = document.getElementById('timestamp');
  ts.textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function renderEditor() {
  const grid = document.getElementById('editor-grid');
  grid.innerHTML = '';
  teams.forEach((team, i) => {
    const color = COLORS[i % COLORS.length];
    const row = document.createElement('div');
    row.className = 'editor-row';
    row.innerHTML = `
      <input type="text" value="${esc(team.name)}" maxlength="20" placeholder="Team name"
        oninput="updateName(${i}, this.value)" style="border-left: 3px solid ${color.fill};" />
      <input type="number" value="${team.pts}" min="0" max="99999" placeholder="Points"
        oninput="updatePts(${i}, this.value)" />
      <button class="btn-danger" onclick="removeTeam(${i})" title="Remove team">✕</button>
    `;
    grid.appendChild(row);
  });
}

function updateName(i, val) {
  teams[i].name = val;
  renderChart();
}

function updatePts(i, val) {
  teams[i].pts = Math.max(0, parseInt(val) || 0);
  renderChart();
}

function removeTeam(i) {
  if (teams.length <= 2) { showToast('⚠ Need at least 2 teams'); return; }
  teams.splice(i, 1);
  renderChart();
  renderEditor();
}

function addTeam() {
  const nameEl = document.getElementById('new-name');
  const ptsEl = document.getElementById('new-pts');
  const name = nameEl.value.trim();
  const pts = Math.max(0, parseInt(ptsEl.value) || 0);
  if (!name) { nameEl.focus(); return; }
  if (teams.length >= 12) { showToast('⚠ Max 12 teams'); return; }
  teams.push({ name, pts });
  nameEl.value = '';
  ptsEl.value = '';
  nameEl.focus();
  renderChart();
  renderEditor();
}

function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg || '✓ Saved!';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

async function saveImage() {
  const zone = document.getElementById('capture-zone');
  try {
    const canvas = await html2canvas(zone, {
      backgroundColor: '#161922',
      scale: 2,
      useCORS: true,
      logging: false,
    });
    const link = document.createElement('a');
    link.download = 'team-leaderboard.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('✓ Image saved!');
  } catch(e) {
    showToast('⚠ Could not save image');
  }
}

document.getElementById('new-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTeam();
});
document.getElementById('new-pts').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTeam();
});

renderChart();
renderEditor();
</script>
</body>
</html>
